name: Backend CI (Test Automatici)

# 1. QUANDO deve attivarsi il robot? Ogni volta che facciamo un "push"
on:
  push:
    branches: [ "main", "master" ]

# 2. COSA deve fare il robot?
jobs:
  test_and_verify:
    # Accende la famosa macchina virtuale Linux
    runs-on: ubuntu-latest 

    steps:
    - name: 📥 Scarica il codice dal repository
      uses: actions/checkout@v4

    - name: 🐍 Installa Python 3.11 sul server Linux
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Installa le librerie del progetto
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest

    - name: 🧪 Lancia il motore di calcolo (Pytest)
      run: |
        cd backend
        pytest -v